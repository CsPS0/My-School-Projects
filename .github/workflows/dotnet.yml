name: dotnet

on:
  push:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.slnx"
      - "**/*.xaml"
      - "**/global.json"
      - ".github/workflows/dotnet.yml"
      - ".github/scripts/build-dotnet.ps1"
      - ".github/ci-skip.txt"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            NEU/Osztaly12/DESKTOP
            NEU/Osztaly12/IKT
            NEU/Osztaly12/TESTING
            NEU/Osztaly13/AKK/DESKTOP
            NEU/Osztaly13/AKK/TESTING

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build and test the C# solutions
        shell: pwsh
        run: ./.github/scripts/build-dotnet.ps1
