<form class="flex flex-col gap-3 sm:flex-row sm:items-end my-6">
    <label class="block flex-1">
        <span class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-200"> Name </span>

        <input type="search" placeholder="e.g. Grand Theft Auto, Metro..."
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-white dark:placeholder-slate-400">
    </label>
    <label class="block sm:w-64">
        <span class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-200">
            Platform </span>
        <select
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
