version: '3.8'

services:
  wwdb:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
    volumes:
      - dashboard_data:/app/data
    restart: unless-stopped

volumes:
  dashboard_data:
