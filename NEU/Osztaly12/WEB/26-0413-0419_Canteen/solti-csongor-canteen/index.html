<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/assets/app.css">
  <title>Menza</title>
</head>

<body class="min-h-screen bg-lime-100 text-lime-800 font-sans">
  <main class="mx-auto max-w-7xl px-4 py-8">
    <header class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-lime-900">Menza</h1>
      </div>

      <button
        id="add-button"
        class="bg-lime-600 px-5 py-3 font-semibold text-white shadow-md transition hover:bg-lime-700 active:scale-95"
      >
        Új menü felvétele
      </button>
    </header>

    <section class="overflow-x-auto rounded-lg bg-white shadow-lg border border-lime-200">
      <table class="min-w-full border-collapse">
        <thead class="bg-lime-200">
          <tr>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Nap</th>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Menü típusa</th>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Leves</th>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Második</th>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Ital</th>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Gyümölcs</th>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Desszert</th>
            <th class="px-4 py-3 text-left text-sm font-bold border-b border-lime-300">Művelet</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-lime-100"></tbody>
      </table>
    </section>
  </main>

  <dialog id="menu-dialog" data-id="" class="w-full max-w-xl rounded-xl p-0 backdrop:bg-black/60 m-auto shadow-2xl border-none">
    <div class="bg-white p-8">
      <h2 id="dialog-title" class="mb-6 text-2xl font-bold text-lime-900 border-b pb-4">Új kerékpár</h2>
      
      <form id="menu-form" class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <input type="hidden" name="id" id="menu-id">
        
        <div class="flex flex-col">
          <label for="day" class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Nap</label>
          <select name="day" id="day" class="w-full border border-slate-300 rounded-md p-2.5 focus:outline-none focus:border-slate-500 transition-colors">
            <option value="Hétfő">Hétfő</option>
            <option value="Kedd">Kedd</option>
            <option value="Szerda">Szerda</option>
            <option value="Csütörtök">Csütörtök</option>
            <option value="Péntek">Péntek</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="type" class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Menü típusa</label>
          <select name="type" id="type" class="w-full border border-slate-300 rounded-md p-2.5 focus:outline-none focus:border-slate-500 transition-colors">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="Diétás">Diétás</option>
            <option value="Vegán">Vegán</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="soup" class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Leves</label>
          <input type="text" name="soup" id="soup" placeholder="Pl. Húsleves" class="w-full border border-slate-300 rounded-md p-2.5 focus:outline-none focus:border-slate-500 transition-colors">
        </div>

        <div class="flex flex-col">
          <label for="main" class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Második</label>
          <input type="text" name="main" id="main" required placeholder="Pl. Rántott hús" class="w-full border border-slate-300 rounded-md p-2.5 focus:outline-none focus:border-slate-500 transition-colors">
        </div>

        <div class="flex flex-col">
          <label for="drink" class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Ital</label>
          <input type="text" name="drink" id="drink" class="w-full border border-slate-300 rounded-md p-2.5 focus:outline-none focus:border-slate-500 transition-colors">
        </div>

        <div class="flex flex-col">
          <label for="fruit" class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Gyümölcs</label>
          <input type="text" name="fruit" id="fruit" class="w-full border border-slate-300 rounded-md p-2.5 focus:outline-none focus:border-slate-500 transition-colors">
        </div>

        <div class="flex flex-col md:col-span-2">
          <label for="dessert" class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Desszert</label>
          <input type="text" name="dessert" id="dessert" class="w-full border border-slate-300 rounded-md p-2.5 focus:outline-none focus:border-slate-500 transition-colors">
        </div>

        <div class="col-span-full mt-6 flex justify-end gap-3 pt-4 border-t">
          <button type="button" id="close-dialog-btn" class="px-6 py-2.5 font-semibold text-slate-600 hover:bg-slate-100 rounded-md transition-colors">
            Mégse
          </button>
          <button type="submit" class="bg-lime-600 px-8 py-2.5 font-bold text-white shadow hover:bg-lime-700 rounded-md transition-all active:scale-95">
            Mentés
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="confirm-dialog" data-id="" class="w-full max-w-md rounded-2xl p-0 backdrop:bg-black/60 m-auto shadow-2xl border-none">
    <div class="p-8">
      <h2 class="font-bold text-2xl mb-4 text-lime-900">Menü törlése</h2>
      <p class="text-slate-600 leading-relaxed mb-8">
        Biztosan ki szeretné törölni a <span class="day font-bold text-lime-700"></span> - <span class="type font-bold text-lime-700"></span> menüt? A művelet nem vonható vissza.
      </p>

      <div class="flex justify-end gap-3">
        <button type="button" class="cancel px-6 py-2.5 rounded-md bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition-colors">
          Mégse
        </button>
        <button class="delete px-6 py-2.5 rounded-md bg-orange-600 text-white font-bold shadow-md hover:bg-orange-700 transition-all active:scale-95">
          Törlés
        </button>
      </div>
    </div>
  </dialog>

  <template id="menu-row-template">
    <tr class="hover:bg-lime-50 transition-colors group">
      <td class="menu-day px-4 py-4 font-bold text-lime-900"></td>
      <td class="menu-type px-4 py-4"></td>
      <td class="menu-soup px-4 py-4 italic text-slate-600"></td>
      <td class="menu-main px-4 py-4 font-medium"></td>
      <td class="menu-drink px-4 py-4"></td>
      <td class="menu-fruit px-4 py-4"></td>
      <td class="menu-dessert px-4 py-4"></td>
      <td class="px-4 py-4 text-right">
        <button
          class="delete-btn bg-orange-50 text-orange-600 px-4 py-1.5 rounded text-sm font-bold opacity-0 group-hover:opacity-100 transition-all hover:bg-orange-600 hover:text-white"
        >
          Törlés
        </button>
      </td>
    </tr>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
