<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School Projects</title>
<meta name="description" content="Searchable index of CsPS0's school projects and assignments.">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
  const isDark = localStorage.theme ? localStorage.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', isDark);
  document.getElementById('hljs-theme')?.setAttribute('href', isDark
    ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css'
    : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css');
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>
<body class="bg-stone-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 text-[15px] leading-normal">
<main class="max-w-4xl mx-auto px-4 pt-5 sm:pt-8 pb-16">
  <header class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold">My School Projects</h1>
      <p class="text-zinc-500 dark:text-zinc-400 mt-1">Search every task and project in
        <a class="text-blue-600 dark:text-blue-400 underline" href="https://github.com/CsPS0/My-School-Projects">CsPS0/My-School-Projects</a>.
        Press <kbd>/</kbd> to search.</p>
    </div>
    <button id="theme" class="ctl shrink-0" aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <div class="sm:sticky top-0 z-10 bg-stone-50/95 dark:bg-zinc-950/95 backdrop-blur py-3 mt-4 space-y-2" role="search">
    <div class="grid grid-cols-2 sm:flex sm:flex-wrap gap-2">
      <input id="q" type="search" class="ctl col-span-2 sm:flex-1 sm:basis-72 min-w-0" autofocus aria-label="Search"
        placeholder="Search projects and files, e.g. sql join, OOP, madár…">
      <select id="grade" class="ctl" aria-label="Grade"><option value="">All grades</option></select>
      <select id="subject" class="ctl" aria-label="Subject"><option value="">All subjects</option></select>
      <select id="sort" class="ctl col-span-2 sm:col-span-1" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-zinc-500 dark:text-zinc-400">
      <label class="flex items-center gap-1.5"><input id="files" type="checkbox"> include files</label>
      <label class="flex items-center gap-1.5"><input id="fav-only" type="checkbox"> <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2-6.2 3.2L7 14.2 2 9.3l6.9-1z"/></svg> favorites only</label>
      <button id="clear" class="underline hover:text-blue-600">reset filters</button>
      <button id="random" class="inline-flex items-center gap-1 underline hover:text-blue-600"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r=".8"/><circle cx="15.5" cy="15.5" r=".8"/><circle cx="12" cy="12" r=".8"/></svg> random project</button>
    </div>
  </div>

  <p id="status" class="text-zinc-500 dark:text-zinc-400 my-3 min-h-6" aria-live="polite">Loading…</p>
  <ul id="results" class="grid gap-2"></ul>
  <button id="more" class="ctl mx-auto mt-4 hidden">Show more</button>
</main>

<!-- Code Viewer Modal Dialog -->
<dialog id="code-dialog" closedby="any" aria-labelledby="code-dialog-title"
  class="w-[95%] max-w-5xl rounded-xl p-0 bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 shadow-2xl border border-zinc-200 dark:border-zinc-800 m-auto">
  <div class="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 p-4 gap-3 bg-stone-100/60 dark:bg-zinc-800/50 rounded-t-xl">
    <div class="min-w-0 flex-1">
      <h2 id="code-dialog-title" class="font-bold text-base sm:text-lg truncate">File Viewer</h2>
      <p id="code-dialog-path" class="text-xs text-zinc-500 dark:text-zinc-400 font-mono truncate"></p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="code-copy-btn" class="ctl flex items-center gap-1.5 text-xs sm:text-sm py-1.5 px-2.5" title="Copy code">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span id="code-copy-text">Copy</span>
      </button>
      <a id="code-github-link" class="ctl flex items-center gap-1.5 text-xs sm:text-sm py-1.5 px-2.5" target="_blank" rel="noopener" title="Open on GitHub">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        GitHub
      </a>
      <button id="code-close-btn" class="ctl py-1.5 px-2.5 text-xs sm:text-sm font-semibold" aria-label="Close dialog" title="Close (Esc)">✕</button>
    </div>
  </div>
  <div id="code-body" class="relative">
    <div id="code-status" class="py-12 text-center text-zinc-500 dark:text-zinc-400">Loading code…</div>
    <pre id="code-pre" class="hidden overflow-auto p-4 text-xs sm:text-sm font-mono leading-relaxed max-h-[75vh]"><code id="code-content"></code></pre>
    <div id="code-media" class="hidden p-6 text-center"></div>
  </div>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
