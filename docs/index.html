<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School Projects</title>
<meta name="description" content="Searchable index of CsPS0's school projects and assignments.">
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #2f6fdf; --tag: #eef2fb; --mark: #fff1a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1d1d20; --text: #ececef; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #7aa7ff; --tag: #25293a; --mark: #5c4d00;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .sub a { color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; position: sticky; top: 0;
    background: var(--bg); padding: 8px 0; z-index: 1; }
  input, select { font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  input[type=search] { flex: 1 1 280px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label.chk { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #status { color: var(--muted); margin: 12px 0; min-height: 1.5em; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li a { display: block; padding: 12px 14px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; color: inherit; text-decoration: none; }
  li a:hover, li a:focus-visible { border-color: var(--accent); }
  .name { font-weight: 600; word-break: break-word; }
  .path { color: var(--muted); font-size: .85rem; word-break: break-all; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { background: var(--tag); border-radius: 999px; padding: 1px 9px; font-size: .78rem; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>My School Projects</h1>
  <p class="sub">Search every task and project in
    <a href="https://github.com/CsPS0/My-School-Projects">CsPS0/My-School-Projects</a>.
    Press <kbd>/</kbd> to search.</p>

  <div class="controls" role="search">
    <input id="q" type="search" placeholder="Search projects and files, e.g. sql join, OOP, madár…" aria-label="Search" autofocus>
    <select id="grade" aria-label="Grade"><option value="">All grades</option></select>
    <select id="subject" aria-label="Subject"><option value="">All subjects</option></select>
    <label class="chk"><input id="files" type="checkbox"> include files</label>
  </div>

  <p id="status" aria-live="polite">Loading…</p>
  <ul id="results"></ul>
</main>

<script>
const REPO = 'CsPS0/My-School-Projects', BRANCH = 'main', MAX = 300;
const $ = id => document.getElementById(id);
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let items = [];

async function loadTree() {
  const key = 'tree:' + REPO;
  try { const c = JSON.parse(sessionStorage.getItem(key)); if (c) return c; } catch {}
  const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
  if (!r.ok) throw new Error(r.status === 403 ? 'GitHub API rate limit hit, try again in a bit.' : 'GitHub API error ' + r.status);
  const tree = (await r.json()).tree.map(t => [t.path, t.type === 'tree']);
  try { sessionStorage.setItem(key, JSON.stringify(tree)); } catch {}
  return tree;
}

function toItem([path, isDir]) {
  const parts = path.split('/'), name = parts.at(-1);
  // both schools use <School>/OsztalyXX/<SUBJECT>/<project>
  const grade = parts[1] ? +parts[1].replace('Osztaly', '') + '. osztály' + (parts[0] === 'Verebay' ? ' (Verebay)' : '') : '';
  const subject = parts[2] || '';
  // folder names like "24-0916-0922_Topic" encode the school week
  const m = name.match(/^(\d{2})-(\d{2})(\d{2})/);
  const date = m ? `20${m[1]} ${MONTHS[+m[2] - 1] || ''} ${+m[3]}` : '';
  const project = isDir && (!!m || parts.length === 4);
  return { path, name, isDir, grade, subject: subject.toUpperCase(), date, sort: m ? m[1] + m[2] + m[3] : '',
           project, hay: fold(path.replace(/[_\-\/.]/g, ' ')) };
}

function highlight(text, words) {
  if (!words.length) return esc(text);
  const f = fold(text), marks = new Array(text.length).fill(false);
  for (const w of words) for (let i = f.indexOf(w); i !== -1; i = f.indexOf(w, i + 1))
    for (let j = i; j < i + w.length; j++) marks[j] = true;
  let out = '';
  for (let i = 0; i < text.length; i++) {
    if (marks[i] && !marks[i - 1]) out += '<mark>';
    out += esc(text[i]);
    if (marks[i] && !marks[i + 1]) out += '</mark>';
  }
  return out;
}

function render() {
  const q = $('q').value.trim(), grade = $('grade').value, subject = $('subject').value;
  const words = fold(q.replace(/[_\-\/.]/g, ' ')).split(/\s+/).filter(Boolean);
  const withFiles = $('files').checked;
  let hits = items.filter(it =>
    (withFiles ? true : it.isDir && (words.length ? true : it.project)) &&
    (!grade || it.grade === grade) && (!subject || it.subject === subject) &&
    words.every(w => it.hay.includes(w)));
  // projects first, newest first, shallow before deep
  hits.sort((a, b) => (b.project - a.project) || b.sort.localeCompare(a.sort) ||
    a.path.split('/').length - b.path.split('/').length || a.path.localeCompare(b.path));
  $('status').textContent = `${hits.length} result${hits.length === 1 ? '' : 's'}` + (hits.length > MAX ? ` (showing first ${MAX})` : '');
  $('results').innerHTML = hits.slice(0, MAX).map(it => {
    const url = `https://github.com/${REPO}/${it.isDir ? 'tree' : 'blob'}/${BRANCH}/${it.path.split('/').map(encodeURIComponent).join('/')}`;
    const tags = [it.isDir ? '📁 folder' : '📄 ' + (it.name.includes('.') ? it.name.split('.').pop() : 'file'), it.grade, it.subject, it.date].filter(Boolean);
    return `<li><a href="${url}" target="_blank" rel="noopener">
      <div class="name">${highlight(it.name, words)}</div>
      <div class="path">${highlight(it.path, words)}</div>
      <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></a></li>`;
  }).join('');
  history.replaceState(null, '', q ? '#' + encodeURIComponent(q) : location.pathname);
}

function fillSelect(sel, values) {
  for (const v of [...new Set(values)].filter(Boolean).sort()) sel.add(new Option(v, v));
}

loadTree().then(tree => {
  items = tree.filter(([p]) => /^(NEU|Verebay)\//.test(p)).map(toItem);
  fillSelect($('grade'), items.map(i => i.grade));
  fillSelect($('subject'), items.filter(i => i.project).map(i => i.subject));
  $('q').value = decodeURIComponent(location.hash.slice(1));
  render();
}).catch(e => { $('status').textContent = e.message; });

for (const id of ['q', 'grade', 'subject', 'files']) $(id).addEventListener('input', render);
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
});
</script>
</body>
</html>
